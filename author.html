<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About the Creator | IntelliFill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080d14;
        }

        .author-screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #080d14;
        }

        .author-image {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>
    <main class="author-screen">
        <img src="assets/author-profile.png" alt="IntelliFill creator profile" class="author-image">
    </main>
</body>

</html>
